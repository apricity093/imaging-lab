# Replace observation with matching physical line integrals. Batch axis is required.
modality: ct
algorithm: fbp
backend: astra
device: cuda
inputs:
  observation:
    path: data/fan_2d_observation.npy
model:
  geometry:
    type: fan_2d
    domain_shape:
    - 1
    - 16
    - 16
    range_shape:
    - 1
    - 12
    - 20
    angles_rad:
    - 0.0
    - 0.5235987755982988
    - 1.0471975511965976
    - 1.5707963267948966
    - 2.0943951023931953
    - 2.617993877991494
    - 3.141592653589793
    - 3.665191429188092
    - 4.1887902047863905
    - 4.71238898038469
    - 5.235987755982988
    - 5.759586531581287
    voxel_size: 1.0
    det_pixel: 1.5
    det_offset_u: 0.0
    source_origin_distance: 64.0
    origin_detector_distance: 32.0
  measurement:
    kind: line_integral
    observation_model: line_integral
params: {}
